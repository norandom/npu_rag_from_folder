[project]
name = "npu-rag"
version = "0.1.0"
description = "NPU-accelerated local retrieval over a personal document archive"
requires-python = ">=3.12,<3.13"

# Baseline dependency set. Vendor NPU runtime packages are deliberately absent:
# they are published only on AMD's private index (https://pypi.amd.com/simple),
# which uv cannot resolve, so they are installed by explicit wheel URL into the
# optional "npu" group below. Keeping them out of the default set is what lets a
# downstream consumer install this package with a plain `uv sync`.
dependencies = [
    # numpy is held below 2 across the whole project: the AMD provider wheels are
    # built against the NumPy 1.x ABI, so a 2.x resolution here would break the
    # environment the moment the npu group is added to it.
    "numpy<2",
    "onnxruntime>=1.20",
    "transformers>=4.44",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
    "optimum>=1.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
]
# Vendor NPU runtime, installed on demand with `uv sync --group npu`, never by
# default. Direct wheel URLs are mandatory: uv cannot resolve
# https://pypi.amd.com/simple (its simple-index pages deviate from the standard
# and uv reports "no versions of onnxruntime-vitisai"), but it installs the same
# wheels cleanly when they are named by URL.
#
# onnxruntime-vitisai ships the `onnxruntime` import package itself and therefore
# REPLACES the stock onnxruntime above inside an NPU-provisioned environment.
# That replacement is intended, not incidental - see docs/provisioning.md,
# "The onnxruntime collision". `tools/provision_npu.py` verifies it took effect.
npu = [
    "onnxruntime-vitisai @ https://pypi.amd.com/packages/onnxruntime-vitisai/onnxruntime_vitisai-1.23.2-cp312-cp312-win_amd64.whl",
    "voe @ https://pypi.amd.com/packages/voe/voe-1.7.0-py3-none-win_amd64.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npu_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# `tools/` is repo tooling, not shipped code (the wheel packages only
# src/npu_rag), so it is reachable via the repo root rather than the install.
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tools"]
strict = true
warn_unreachable = true
